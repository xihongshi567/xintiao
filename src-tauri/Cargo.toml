[package]
name = "xintiao"
version = "0.1.0"
description = "薪跳 · 桌面小组件"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
strip = true
